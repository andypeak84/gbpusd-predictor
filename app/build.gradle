plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def fredApiKey = localProperties.getProperty('FRED_API_KEY', 'MISSING_FRED_KEY')

android {
    compileSdk 34
    namespace "com.example.gbpusdpredictor"

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.example.gbpusdpredictor"
        minSdk 26
        targetSdk 34
        versionCode 65
        // Synced to the newgdp-vNN zip numbering this project ships under (see
        // MainActivity.kt, which shows this on-screen) -- bump both this and versionCode
        // above together on every delivered zip from here on. Jumped 63 -> 65 (skipping
        // 64) because the prior oilChange5d anchor-tolerance fix shipped without this
        // bump -- the phone kept showing v63 despite that fix being live, real confusion
        // during a live debugging session. Never skip this again.
        versionName "65"

        testApplicationId "com.example.gbpusdpredictor.test"

        buildConfigField "String", "FRED_API_KEY", "\"${fredApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // No ML runtime dependency needed: the tree model is evaluated by walking a plain
    // JSON structure (see ml/TreeModelPredictor.kt) using org.json, built into Android.
    // TFLite was dropped -- TF-DF/YDF's tree-inference ops don't convert to TFLite; see
    // TreeModelPredictor.kt's class doc for details.
}
