plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Release signing: the upload keystore and its passwords live OUTSIDE git (keystore.properties is
// gitignored; see keystore.properties.example). Without that file the release build is left unsigned.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// AdMob. Google's published TEST ids: debug builds ALWAYS use these (tapping a real ad on a
// development device risks an invalid-traffic ban on the AdMob account). Release builds use the real
// ids from local.properties (ADMOB_APP_ID / ADMOB_BANNER_ID -- not secrets, just account-specific) and
// fall back to the test ids so that a missing property can never break a build; bundleRelease (the file
// that goes to Play) refuses to build with test ids, see the guard at the bottom of this file.
def TEST_ADMOB_APP_ID = 'ca-app-pub-3940256099942544~3347511713'
def TEST_ADMOB_BANNER_ID = 'ca-app-pub-3940256099942544/9214589741'
def admobAppId = localProperties.getProperty('ADMOB_APP_ID', TEST_ADMOB_APP_ID)
def admobBannerId = localProperties.getProperty('ADMOB_BANNER_ID', TEST_ADMOB_BANNER_ID)
def usingTestAdIds = (admobAppId == TEST_ADMOB_APP_ID || admobBannerId == TEST_ADMOB_BANNER_ID)

android {
    // API 36 (Android 16): Google Play requires new apps to target it (deadline 2026-08-31). Compiled against
    // the installed 36.1 platform (a minor release of API 36) so nothing has to be downloaded; targetSdk is 36.
    compileSdkVersion 'android-36.1'
    // The code lives in this package (unchanged); the Play-facing identity is applicationId below.
    namespace "com.example.gbpusdpredictor"

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // Permanent once published. com.example.* is a placeholder id that Google Play rejects.
        applicationId "com.andypeak.gbpusdpredictor"
        minSdk 26
        targetSdk 36
        versionCode 79
        // Synced to the newgdp-vNN zip numbering this project ships under (see
        // MainActivity.kt, which shows this on-screen) -- bump both this and versionCode
        // above together on every delivered zip from here on. Jumped 63 -> 65 (skipping
        // 64) because the prior oilChange5d anchor-tolerance fix shipped without this
        // bump -- the phone kept showing v63 despite that fix being live, real confusion
        // during a live debugging session. Never skip this again.
        versionName "79"

        testApplicationId "com.andypeak.gbpusdpredictor.test"

        // Debug builds only (see ads/ConsentManager): hashed id of a test device, to see the UK/EEA consent form.
        buildConfigField "String", "UMP_TEST_DEVICE_ID", "\"${localProperties.getProperty('UMP_TEST_DEVICE_ID', '')}\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: TEST_ADMOB_APP_ID]
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${TEST_ADMOB_BANNER_ID}\""
        }
        release {
            // R8 shrinks and obfuscates: proguard-rules.pro keeps everything Gson/Retrofit reach by
            // reflection (the data/ and network/ model classes). Without those rules a release build
            // parses nothing and History export/import silently breaks.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            manifestPlaceholders = [admobAppId: admobAppId]
            buildConfigField "String", "ADMOB_BANNER_ID", "\"${admobBannerId}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 2.x: the old android { kotlinOptions { jvmTarget } } DSL is removed; this is its replacement.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Room
    def room_version = "2.8.5"  // 2.6.x cannot read the Kotlin 2.3 metadata the build now produces
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Google AdMob banner ads. Brings Google's User Messaging Platform (consent form) in transitively
    // via play-services-ads-api, so no separate UMP dependency is declared. Needs Kotlin >= 2.2 (the SDK
    // is built with Kotlin 2.3 metadata), hence the Kotlin 2.3.21 plugin in the root build.gradle.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'

    // No ML runtime dependency needed: the tree model is evaluated by walking a plain
    // JSON structure (see ml/TreeModelPredictor.kt) using org.json, built into Android.
    // TFLite was dropped -- TF-DF/YDF's tree-inference ops don't convert to TFLite; see
    // TreeModelPredictor.kt's class doc for details.
}

// The Play bundle must never go out with Google's TEST ad ids (no ad revenue, and a policy risk).
// assembleRelease (a local APK for on-device testing) is allowed to use them; bundleRelease is not.
afterEvaluate {
    tasks.matching { it.name == 'bundleRelease' }.configureEach {
        doFirst {
            if (usingTestAdIds) {
                throw new GradleException("bundleRelease refused: ADMOB_APP_ID / ADMOB_BANNER_ID are not set in " +
                    "local.properties, so the build would ship Google's test ad ids. Add your real AdMob ids first.")
            }
        }
    }
}
